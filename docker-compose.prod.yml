# Deployment-Compose – wird per GitHub Action nach /root/haltestellenanzeige/docker-compose.yml
# übertragen. Nutzt das vorab per `docker load` bereitgestellte Image, baut also NICHT.

services:
  haltestellenanzeige:
    image: haltestellenanzeige:latest
    container_name: haltestellenanzeige
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      TZ: Europe/Berlin
